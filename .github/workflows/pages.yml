# Builds the website and publishes it on GitHub Pages.
#
# This repo is also the public download channel: every installer is a release
# here. A new release rebuilds the site right away, so its update feed
# (/api/<id>/latest.json) is live within a minute or two. Also on every push,
# hourly as a safety net, and on demand.
name: Website

on:
  push:
    branches: [main]
  release:
    types: [published, edited, deleted]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Build (fetches releases and catalog first)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
